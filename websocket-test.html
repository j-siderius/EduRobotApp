<!DOCTYPE html>
<html>

<head>
    <title>ESP32 Pub/Sub (ESP-IDF)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        div {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 120px;
        }

        input[type="text"] {
            padding: 5px;
            width: 200px;
        }

        button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #messageOutput,
        #debugOutput {
            width: 100%;
            height: 100px;
            padding: 5px;
            resize: none;
            background-color: #fff;
            border: 1px solid #ddd;
        }

        #debugOutput {
            height: 50px;
        }
    </style>
</head>

<body>

    <div>
        <label for="websocketIP">WebSocket IP:</label>
        <input type="text" id="websocketIP" value="192.168.1.8:80">
        <button id="connectButton">Connect</button>
    </div>

    <div>
        <label for="messageInput">Message:</label>
        <input type="text" id="messageInput">
        <button id="sendButton">Send</button>
    </div>

    <div>
        <label for="messageOutput">Message History:</label>
        <textarea id="messageOutput" readonly></textarea>
    </div>

    <div>
        <label for="debugOutput">Debug Output:</label>
        <textarea id="debugOutput" readonly></textarea>
    </div>

    <script>
        let socket;

        document.getElementById("connectButton").addEventListener("click", () => {
            let ip = document.getElementById("websocketIP").value;
            if (!ip.includes(":80")) ip += ":80";
            socket = new WebSocket(`ws://${ip}/ws`);

            socket.addEventListener("open", (event) => {
                logDebug("Connected to WebSocket server");
            });

            socket.addEventListener("message", (event) => {
                logMessage(event.data);
            });

            socket.addEventListener("close", (event) => {
                logDebug("Disconnected from WebSocket server");
            });

            socket.addEventListener("error", (event) => {
                logDebug("WebSocket error: " + event.message);
            });
        });

        document.getElementById("sendButton").addEventListener("click", sendMessage);

        document.getElementById("messageInput").addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        function sendMessage() {
            const message = document.getElementById("messageInput").value;
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(message);
                logMessage("Sent: " + message);
                document.getElementById("messageInput").value = "";
            } else {
                logDebug("WebSocket is not connected");
            }
        }

        function logMessage(message) {
            const messageOutput = document.getElementById("messageOutput");
            messageOutput.value += message + "\n";
            messageOutput.scrollTop = messageOutput.scrollHeight;
        }

        function logDebug(message) {
            const debugOutput = document.getElementById("debugOutput");
            debugOutput.value += message + "\n";
            debugOutput.scrollTop = debugOutput.scrollHeight;
        }
    </script>
</body>

</html>
