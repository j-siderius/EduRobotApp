<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexabot WiFi Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 24px;
            max-width: 400px;
            width: 100%;
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .description {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .success-message.show {
            display: block;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
        }

        input[type="text"],
        input[type="password"] {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
         input.error {
            border-color: #fc8181;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            flex: 1;
            margin: 0;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #718096;
            padding: 4px 8px;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #2d3748;
        }
        
         .password-hint {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 4px;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
                border-radius: 12px;
            }

            h1 {
                font-size: 24px;
            }

            .icon {
                font-size: 40px;
            }

            input[type="text"],
            input[type="password"] {
                font-size: 16px;
                padding: 14px 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon">📡</div>
            <h1>Hexabot WiFi Setup</h1>
            <p class="description">Connect the Hexabot to your WiFi network by entering the credentials below</p>
        </div>

        <div class="message error-message" id="errorMessage"></div>
        <div class="message success-message" id="successMessage">✓ WiFi credentials configured</div>

        <form method="POST" action="/">
            <div class="form-group">
                <label for="ssid">Network Name (SSID)</label>
                <input type="text" id="ssid" name="ssid" placeholder="Enter Network" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter password" minlength="8" required autocomplete="off">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
                <p class="password-hint">Minimum 8 characters</p>
            </div>

            <button type="submit">Connect to WiFi</button>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const wifiForm = document.getElementById('wifiForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Toggle password visibility
        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🚫';
             });

        // Form validation and submission
        wifiForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const password = passwordInput.value;

            // Clear previous messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            passwordInput.classList.remove('error');

            // Validate password length
            if (password.length < 8) {
                errorMessage.textContent = '✗ Password must be at least 8 characters';
                errorMessage.classList.add('show');
                passwordInput.classList.add('error');
                return;
            }

            // Show success message and submit
            successMessage.classList.add('show');
            setTimeout(() => {
                wifiForm.submit();
            }, 2000);
        });
    </script>
</body>

</html>
