<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Programming Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header and Navigation */
        header {
            background: #1a1a1a;
            color: white;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            height: 70px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 30px;
            gap: 40px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 5px;
        }

        nav button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            height: 70px;
            display: flex;
            align-items: center;
        }

        nav button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        nav button.active {
            color: white;
            border-bottom-color: #ffffff;
        }

        .status-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff6b6b;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background-color: #51cf66;
            animation: none;
        }

        .status-indicator.connecting {
            background-color: #ffd700;
            animation: pulse 1s infinite;
        }

        .status-indicator.disconnected {
            background-color: #ff6b6b;
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            background-color: #ffffff;
        }

        .tab-content {
            width: 100%;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        /* Programming Tab */
        #programming-tab {
            padding: 20px;
        }

        .canvas-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .canvas-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e8ecf1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .canvas-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .canvas-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #2c2c2c;
            color: white;
        }

        .btn-primary:hover {
            background-color: #000000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .btn-run {
            background-color: #427d5a;
            animation: pulse 2s infinite;
        }

        .btn-secondary {
            background-color: #e8ecf1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background-color: #d8e0ea;
        }

        .btn-red {
            background-color: #bb0000;
            color: white;
        }

        .btn-red:hover {
            background-color: #500000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .blockly-canvas {
            flex: 1;
            background-color: #f9fafb;
            border-radius: 0 0 8px 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #95a5a6;
            font-size: 16px;
        }

        /* Data Tab */
        #data-tab {
            padding: 20px;
            overflow-y: auto;
        }

        .data-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            padding: 0;
            overflow: hidden;
        }

        .data-header {
            padding: 20px;
            border-bottom: 1px solid #e8ecf1;
        }

        .data-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f9fafb;
            border-bottom: 2px solid #e8ecf1;
        }

        th {
            padding: 12px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid #e8ecf1;
            font-size: 14px;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .variable-name {
            font-weight: 600;
            color: #2c3e50;
        }

        .variable-value {
            font-family: 'Courier New', monospace;
            background-color: #f0f2f5;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        .variable-type {
            color: #666;
            font-size: 12px;
        }

        /* Settings Tab */
        #settings-tab {
            padding: 20px;
            overflow-y: auto;
        }

        .settings-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            padding: 30px;
            max-width: 600px;
        }

        .settings-container h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8dcE0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #2c2c2c;
            box-shadow: 0 0 0 3px rgba(44, 44, 44, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-save {
            flex: 1;
            padding: 12px;
            background-color: #2c2c2c;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-save:hover {
            background-color: #000000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .btn-reset {
            flex: 1;
            padding: 12px;
            background-color: #e8ecf1;
            color: #2c3e50;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-reset:hover {
            background-color: #d8e0ea;
        }

        .form-helper {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 15px;
                gap: 15px;
            }

            nav button {
                padding: 10px 12px;
                font-size: 13px;
            }

            .status-panel {
                gap: 12px;
                font-size: 11px;
            }

            .settings-container {
                padding: 20px;
            }

            .canvas-header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }

        .blocklyToolboxCategoryLabel {
            color: #2c3e50;
        }
    </style>
    <!-- Load Blockly core -->
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <!-- Load the default blocks -->
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <!-- Load a generator -->
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <!-- Load a message file -->
    <script src="https://unpkg.com/blockly/msg/en.js"></script>
</head>

<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="logo">RoboCode</div>
                <nav>
                    <button class="tab-button active" data-tab="programming">Programming</button>
                    <button class="tab-button" data-tab="data">Data</button>
                    <button class="tab-button" data-tab="settings">Settings</button>
                </nav>
            </div>
            <div class="status-panel">
                <div class="status-item">
                    <div class="status-indicator disconnected"></div>
                    <span>Disconnected</span>
                </div>
                <div class="status-item">
                    <span>Last ping: <strong><span id="lastPing">N/A</span> ms</strong></span>
                </div>
                <div class="status-item">
                    <span>Last clockcycle: <strong><span id="lastClockcycle">N/A</span> ms</strong></span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Programming Tab -->
        <div id="programming-tab" class="tab-content active">
            <div class="canvas-container">
                <div class="canvas-header">
                    <h2>Blockly Programming Canvas</h2>
                    <div class="canvas-controls">
                        <button class="btn btn-secondary"
                            onclick="document.getElementById('jsonFileInput').click();">Load code</button>
                        <input type="file" id="jsonFileInput" accept=".json" style="display:none;"
                            onchange="loadCode(event)" />
                        <button class="btn btn-secondary" onclick="saveCode()">Save code</button>
                        <hr>
                        <button class="btn btn-primary" id="runButton" onclick="runCode();">Run code</button>
                        <button class="btn btn-red" onclick="stopCode();">Stop code</button>
                    </div>
                </div>
                <div class="blockly-canvas">
                    <div id="blocklyDiv" style="height: 100%; width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Data Tab -->
        <div id="data-tab" class="tab-content">
            <div class="data-container">
                <div class="data-header">
                    <h2>Robot Variables</h2>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Variable Name</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="dbTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings-tab" class="tab-content">
            <div class="settings-container">
                <h2>Robot Settings</h2>
                <form id="settings-form">
                    <div class="form-group">
                        <label for="robot-address">Robot Address</label>
                        <input type="text" id="robot-address" name="robot-address" value="192.168.1.100">
                        <div class="form-helper">IP address or hostname of your robot</div>
                    </div>

                    <!-- WARNING: Speed currently disabled! -->
                    <div class="form-group" style="display: none;">
                        <label for="robot-speed">Motor Speed (1-10)</label>
                        <input type="number" id="robot-speed" name="robot-speed" min="1" max="10" value="5">
                        <div class="form-helper">Default motor speed for movement commands</div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-save" onclick="saveSettings()">Save Settings</button>
                        <button type="reset" class="btn-reset" onclick="removeUserdata()">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Get all tab buttons
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');

        // Add click event listener to each button
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.getAttribute('data-tab');

                // Remove active class from all buttons and content
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));

                // Add active class to clicked button and corresponding content
                button.classList.add('active');
                document.getElementById(tabName + '-tab').classList.add('active');
            });
        });

        const indicator = document.querySelector('.status-indicator');
        const statusText = document.querySelector('.status-item span');
        function setConnectionStatus(status) {

            // Remove all status classes
            indicator.classList.remove('connected', 'connecting', 'disconnected');

            // Set the new status class and text
            switch (status) {
                case 'connected':
                    indicator.classList.add('connected');
                    statusText.textContent = 'Connected';
                    break;
                case 'connecting':
                    indicator.classList.add('connecting');
                    statusText.textContent = 'Connecting...';
                    break;
                case 'disconnected':
                    indicator.classList.add('disconnected');
                    statusText.textContent = 'Disconnected';
                    break;
            }
        }

        // ------------------------------- WEBSOCKETS -----------------------------------------

        let db = {
            _version: 0.1
        };
        let robotaddr;
        let robotsocket;
        let lastMessage;
        let messageTimer = 0;
        let messageCounter = 0;

        window.onload = function () {
            if (localStorage.getItem("robotWebsocketAddress")) {
                robotaddr = localStorage.getItem("robotWebsocketAddress");
                connectRobot(robotaddr);
                document.getElementById("robot-address").value = robotaddr;
            }

            buildBlocklyWorkspace();

            setInterval(updateTable, 50);
        }

        const lastPingDOM = document.getElementById('lastPing');
        function connectRobot(addr) {
            if (localStorage.getItem("robotWebsocketAddress") != addr) {
                localStorage.setItem("robotWebsocketAddress", addr);
            }

            setConnectionStatus('connecting');
            robotsocket = new WebSocket(addr);

            robotsocket.addEventListener("open", (event) => {
                console.log(robotsocket);
                setConnectionStatus('connected');
            });
            robotsocket.addEventListener("message", (event) => {
                // console.log("Received WebSocket message: " + event.data);

                messageTimer += performance.now() - lastMessage;
                lastMessage = performance.now();
                messageCounter += 1;
                if (messageCounter % 10 == 0) {
                    lastPingDOM.innerHTML = new String(messageTimer / 10).padStart(2, "0");
                    messageTimer = 0;
                }

                let data = parseMessage(event.data);
                db[data.keys] = data.variables;
            });
            robotsocket.addEventListener("close", (event) => {
                console.log("Disconnected from WebSocket server");
                setConnectionStatus('disconnected');
            });
            robotsocket.addEventListener("error", (event) => {
                console.error("WebSocket error: " + event.message);
                setConnectionStatus('connecting');
            });
        }

        function parseMessage(message) {
            // Split by '/' and filter out empty strings
            const tokens = message.split('/').filter(token => token.length > 0);

            let keys = [];
            let variables = [];

            for (const token of tokens) {
                // Check if token starts with a letter (name)
                if (/^[a-zA-Z]/.test(token)) {
                    keys.push(token);
                }
                // Check if token is a number (variable)
                else if (/^-?\d+(\.\d+)?$/.test(token)) {
                    variables.push(parseFloat(token));
                }
            }

            return { keys, variables };
        }

        function removeUserdata() {
            if (confirm("Are you sure you want to remove all user data? This includes the Robot setup and all codeblocks!")) {
                localStorage.removeItem("robotWebsocketAddress");
                localStorage.removeItem("blocklyWorkspaceState");
                document.getElementById("robot-address").value = "192.168.1.100";
                document.getElementById("robot-speed").value = 5;
            }
        }

        function saveSettings() {
            // WARNING: Speed currently disabled!
            robotaddr = document.getElementById("robot-address").value;
            connectRobot(`ws://${robotaddr}/`);
        }

        function updateTable() {
            const dbTableBody = document.getElementById('dbTableBody');
            dbTableBody.innerHTML = ''; // Clear existing rows

            for (let key in db) {
                // key, db[key]
                const row = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.className = 'variable-name';
                nameCell.textContent = key;

                const valueCell = document.createElement('td');
                const valueSpan = document.createElement('span');
                valueSpan.className = 'variable-value';
                valueSpan.textContent = db[key];
                valueCell.appendChild(valueSpan);

                row.appendChild(nameCell);
                row.appendChild(valueCell);
                dbTableBody.appendChild(row);
            }
        }

        // ------------------------------- BLOCKLY --------------------------------------------

        let workspace;
        function buildBlocklyWorkspace() {

            // ########## CONTROL BLOCKS ##########
            Blockly.Blocks['when_start'] = {
                init: function () {
                    this.appendDummyInput()
                        .appendField("When START is pressed");
                    this.setNextStatement(true);
                    this.setColour(160);
                }
            };
            javascript.javascriptGenerator.forBlock['when_start'] = function (block) {
                return '// When START is pressed\n';
            };

            Blockly.Blocks['start'] = {
                init: function () {
                    this.appendDummyInput()
                        .appendField('Starting block');
                    this.appendStatementInput('SETUP')
                        .appendField('Setup');
                    this.appendStatementInput('LOOP')
                        .appendField('Loop');
                    this.setColour(120);
                }
            };
            javascript.javascriptGenerator.forBlock['start'] = function (block) {
                var statements_setup = Blockly.JavaScript.statementToCode(block, 'SETUP');
                var statements_loop = Blockly.JavaScript.statementToCode(block, 'LOOP');

                var code = statements_setup +
                    `function loop() {
                        if (_stop) clearInterval(intervalFunction);
                        const startTime = performance.now();
                        ${statements_loop}
                        const endTime = performance.now();
                        const executionTime = endTime - startTime;
                        document.getElementById("lastClockcycle").innerHTML = executionTime;
                        if (executionTime > 9) {
                            throw 'Loop execution took ' + executionTime.toFixed(2) + 'ms, exceeding 9ms limit';
                        }
                    }

                    const intervalFunction = setInterval(loop, 10);
                    `;

                return code;
            };
            // ========== CONTROL BLOCKS ==========

            // ########## SENSOR / DB BLOCKS ##########
            Blockly.Blocks['temperature'] = {
                init: function () {
                    this.appendDummyInput('NAME')
                        .appendField('CPU Temperature sensor');
                    this.setOutput(true, null);
                    this.setColour(225);
                }
            };
            javascript.javascriptGenerator.forBlock['temperature'] = function () {
                var code = 'db["temperature"]';
                return [code, Blockly.JavaScript.ORDER_MEMBER];
            }

            Blockly.Blocks['front_distance'] = {
                init: function () {
                    this.appendDummyInput('NAME')
                        .appendField('Front Distance sensor');
                    this.setOutput(true, null);
                    this.setColour(225);
                }
            };
            javascript.javascriptGenerator.forBlock['front_distance'] = function () {
                var code = 'db["front_distance"]';
                return [code, Blockly.JavaScript.ORDER_MEMBER];
            }

            Blockly.Blocks['battery_voltage'] = {
                init: function () {
                    this.appendDummyInput('NAME')
                        .appendField('Battery Voltage sensor');
                    this.setOutput(true, null);
                    this.setColour(225);
                }
            };
            javascript.javascriptGenerator.forBlock['battery_voltage'] = function () {
                var code = 'db["battery,voltage"]';
                return [code, Blockly.JavaScript.ORDER_MEMBER];
            }

            Blockly.Blocks['battery_soc'] = {
                init: function () {
                    this.appendDummyInput('NAME')
                        .appendField('Battery State of Charge');
                    this.setOutput(true, null);
                    this.setColour(225);
                }
            };
            javascript.javascriptGenerator.forBlock['battery_soc'] = function () {
                var code = 'db["battery,soc"]';
                return [code, Blockly.JavaScript.ORDER_MEMBER];
            }

            // TODO: implement selection of which variable is required
            Blockly.Blocks['motor_position'] = {
                init: function () {
                    this.appendDummyInput('NAME')
                        .appendField('Motor Position')
                        .appendField(new Blockly.FieldDropdown([
                            ['x', '0'],
                            ['y', '1']
                        ]), 'POSITION');
                    this.setOutput(true, null);
                    this.setColour(225);
                }
            };
            javascript.javascriptGenerator.forBlock['motor_position'] = function (block) {
                var positionNr = block.getFieldValue('POSITION');

                // TODO: add position selection here, probably cast to array and then select
                var code = `db["motors,position"][${positionNr}]`;
                return [code, Blockly.JavaScript.ORDER_MEMBER];
            }

            Blockly.Blocks['cliff'] = {
                init: function () {
                    this.appendDummyInput('NAME')
                        .appendField('Cliff')
                        .appendField(new Blockly.FieldDropdown([
                            ['1 (middle)', '0'],
                            ['2 (left)', '1'],
                            ['3 (right)', '2']
                        ]), 'CLIFF');
                    this.setOutput(true, null);
                    this.setColour(225);
                }
            };
            javascript.javascriptGenerator.forBlock['cliff'] = function (block) {
                var cliffNr = block.getFieldValue('CLIFF');

                // TODO: add position selection here, probably cast to array and then select
                var code = `db["cliff"][${cliffNr}]`;
                return [code, Blockly.JavaScript.ORDER_MEMBER];
            }
            // ========== SENSOR / DB BLOCKS ==========

            // ########## COMMAND BLOCKS ##########
            Blockly.Blocks['move_motor'] = {
                init: function () {
                    this.appendDummyInput('DESCRIPTION')
                        .appendField('Move Motors by');
                    this.appendValueInput('XPOS')
                        .setCheck('Number');
                    this.appendDummyInput('DESCRIPTION2')
                        .appendField('X (mm) and');
                    this.appendValueInput('YPOS')
                        .setCheck('Number');
                    this.appendEndRowInput('DESCRIPTION3')
                        .appendField('Y (mm)');
                    this.setPreviousStatement(true, null);
                    this.setNextStatement(true, null);
                    this.setTooltip('');
                    this.setHelpUrl('');
                    this.setColour(0);
                }
            };
            javascript.javascriptGenerator.forBlock['move_motor'] = function (block) {
                // Get the blocks connected to the value inputs
                let xposBlock = block.getInputTargetBlock('XPOS');
                let yposBlock = block.getInputTargetBlock('YPOS');

                // Generate code from those blocks
                let xpos = javascript.javascriptGenerator.blockToCode(xposBlock)[0];
                let ypos = javascript.javascriptGenerator.blockToCode(yposBlock)[0];

                return `robotsocket.send("/motors/move/${xpos}/${ypos}");\n`;
            }

            Blockly.Blocks['rotate_motor'] = {
                init: function () {
                    this.appendDummyInput('DESCRIPTION')
                        .appendField('Rotate Motors by');
                    this.appendValueInput('ROTATE')
                        .setCheck('Number');
                    this.appendEndRowInput('DESCRIPTION2')
                        .appendField('degrees (0 - 360)');
                    this.setPreviousStatement(true, null);
                    this.setNextStatement(true, null);
                    this.setTooltip('');
                    this.setHelpUrl('');
                    this.setColour(0);
                }
            };

            javascript.javascriptGenerator.forBlock['rotate_motor'] = function (block) {
                // Get the blocks connected to the value inputs
                let rotationBlock = block.getInputTargetBlock('ROTATE');

                // Generate code from those blocks
                let angle = javascript.javascriptGenerator.blockToCode(rotationBlock)[0];

                return `robotsocket.send("/motors/rotate/${angle}");\n`;
            }

            // TODO: implement selection of LED and color via picker?
            Blockly.Blocks['led_color'] = {
                init: function () {
                    this.appendValueInput('LEDCOLOR')

                        .appendField('Set LED')

                            ['2', 'two']

                        .appendField('to');
                    this.appendEndRowInput('NAME')
                        .appendField('(hue)');
                    this.setPreviousStatement(true, null);
                    this.setNextStatement(true, null);
                    this.setTooltip('');
                    this.setHelpUrl('');
                    this.setColour(0);
                }
            };
            javascript.javascriptGenerator.forBlock['led_color'] = function (block) {
                let colorBlock = block.getInputTargetBlock('LEDCOLOR');
                let hueColor = javascript.javascriptGenerator.blockToCode(colorBlock)[0];

                let ledNr = block.getFieldValue('LEDNR');

                rgbColor = hueToRgb(hueColor);

                return `robotsocket.send("/leds/${ledNr}/${rgbColor.r}/${rgbColor.g}/${rgbColor.b}");\n`;
            }

            Blockly.Blocks['log'] = {
                init: function () {
                    this.appendValueInput('MSG')
                        .setCheck(['Number', 'String'])

                    this.setPreviousStatement(true, null);
                    this.setNextStatement(true, null);
                    this.setColour(0);
                }
            };
            javascript.javascriptGenerator.forBlock['log'] = function (block, generator) {
                var message = generator.valueToCode(block, 'MSG', javascript.Order.ATOMIC);

            Blockly.Blocks['send_websocket'] = {
                init: function () {

                    this.setPreviousStatement(true, null);
                    this.setNextStatement(true, null);
                    this.setColour(0);
                }
            };
            javascript.javascriptGenerator.forBlock['send_websocket'] = function (block, generator) {
                var message = generator.valueToCode(block, 'MSG', javascript.Order.ATOMIC);
                return `robotsocket.send("${message}");\n`;
            };
            // ========== COMMAND BLOCKS ==========


            const toolbox = {
                "kind": "categoryToolbox",
                "contents": [
                    {

                            { "kind": "block", "type": "logic_boolean" },
                            { "kind": "block", "type": "logic_compare" },

                    },
                    {

                        "name": "Variables",
                        "contents": [

                            { "kind": "block", "type": "math_number" },
                            { "kind": "block", "type": "text" },

                        ]
                    },
                    {
                        "kind": "category",
                        "name": "Sensors",
                        "contents": [
                            { "kind": "block", "type": "temperature" },
                            { "kind": "block", "type": "front_distance" },
                            { "kind": "block", "type": "battery_voltage" },
                            { "kind": "block", "type": "battery_soc" },
                            { "kind": "block", "type": "motor_position" },
                            { "kind": "block", "type": "cliff" },
                        ]
                    },
                    {
                        "kind": "category",
                        "name": "Outputs",
                        "contents": [
                            {
                                "kind": "block", "type": "move_motor",
                                "inputs": {
                                    "XPOS": {
                                        "block": {
                                            "type": "math_number",
                                            "fields": {

                                    "YPOS": {

            workspace = Blockly.inject('blocklyDiv', { toolbox: toolbox, sounds: false });

            if (localStorage.getItem("blocklyWorkspaceState")) {
                let state = JSON.parse(localStorage.getItem("blocklyWorkspaceState"));

                Blockly.serialization.workspaces.load(state, workspace);
                console.log("Found saved Blockly workspace");
            }
        }

        function runCode() {
            _stop = false;
            // window.LoopTrap = 1000;
            // javascript.javascriptGenerator.INFINITE_LOOP_TRAP =
            //     'if(--window.LoopTrap == 0) throw "Infinite loop.";\n';
            const code = javascript.javascriptGenerator.workspaceToCode(Blockly.getMainWorkspace());

            const state = Blockly.serialization.workspaces.save(Blockly.getMainWorkspace());
            localStorage.setItem('blocklyWorkspaceState', JSON.stringify(state));

            console.log(code);
            document.getElementById("runButton").classList.add("btn-run");

            // Run the code locally
            try {
                eval(code);
            } catch (e) {
                console.error("The Blockly code threw an error: " + e);
            }

            document.getElementById("runButton").classList.remove("btn-run");

            // nextStep();
        }

        let _stop = false;
        function stopCode() {
            _stop = true;
        }

        function saveCode() {
            const state = Blockly.serialization.workspaces.save(Blockly.getMainWorkspace());
            console.log("Saved state:", state);

            let exportName = "robocode_program_" + Date.now() + ".json";
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            // let dataStr = JSON.stringify(state);
            let downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", exportName);
            document.body.appendChild(downloadAnchorNode); // required for firefox
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function loadCode(event) {
            // Check if a file was selected
            if (event.target.files.length > 0) {
                const file = event.target.files[0];

                // Create a FileReader to read the JSON file
                const reader = new FileReader();

                // Event listener for when the file is loaded
                reader.onload = function (e) {
                    try {
                        let state = JSON.parse(e.target.result);
                        console.log('Loaded JSON:', state);

                        // TODO: fix import to Blockly canvas from JSON file
                        workspace.clear();
                        Blockly.serialization.workspaces.load(state, workspace);
                    } catch (error) {
                        console.error('Error parsing JSON:', error);
                        alert('Invalid JSON file');
                    }
                };

                // Read the file as text
                reader.readAsText(file);
            }
        }

        function hueToRgb(hue) {
            hue = (hue % 256) / 256 * 6;
            const i = Math.floor(hue);
            const f = hue - i;
            const q = 255 * (1 - f);
            const t = 255 * f;

            switch (i % 6) {
                case 0: return { r: 255, g: Math.round(t), b: 0 };
                case 1: return { r: Math.round(q), g: 255, b: 0 };
                case 2: return { r: 0, g: 255, b: Math.round(t) };
                case 3: return { r: 0, g: Math.round(q), b: 255 };
                case 4: return { r: Math.round(t), g: 0, b: 255 };
                case 5: return { r: 255, g: 0, b: Math.round(q) };
            }
        }
