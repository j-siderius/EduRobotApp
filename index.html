<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexabot Programming Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header and Navigation */
        header {
            background: #1a1a1a;
            color: white;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            height: 70px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 30px;
            gap: 40px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 5px;
        }

        nav button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            height: 70px;
            display: flex;
            align-items: center;
        }

        nav button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        nav button.active {
            color: white;
            border-bottom-color: #ffffff;
        }

        .status-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff6b6b;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background-color: #51cf66;
            animation: none;
        }

        .status-indicator.connecting {
            background-color: #ffd700;
            animation: pulse 1s infinite;
        }

        .status-indicator.disconnected {
            background-color: #ff6b6b;
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            background-color: #ffffff;
        }

        .tab-content {
            width: 100%;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        /* Programming Tab */
        #programming-tab {
            padding: 20px;
        }

        .canvas-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .canvas-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e8ecf1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .canvas-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .canvas-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #2c2c2c;
            color: white;
        }

        .btn-primary:hover {
            background-color: #000000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .btn-run {
            background-color: #427d5a;
            animation: pulse 2s infinite;
        }

        .btn-secondary {
            background-color: #e8ecf1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background-color: #d8e0ea;
        }

        .btn-red {
            background-color: #bb0000;
            color: white;
        }

        .btn-red:hover {
            background-color: #500000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .blockly-canvas {
            flex: 1;
            background-color: #f9fafb;
            border-radius: 0 0 8px 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #95a5a6;
            font-size: 16px;
        }

        /* Data Tab */
        #data-tab {
            padding: 20px;
            overflow-y: auto;
        }

        .data-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            padding: 0;
            overflow: hidden;
        }

        .data-header {
            padding: 20px;
            border-bottom: 1px solid #e8ecf1;
        }

        .data-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f9fafb;
            border-bottom: 2px solid #e8ecf1;
        }

        th {
            padding: 12px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid #e8ecf1;
            font-size: 14px;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .variable-name {
            font-weight: 600;
            color: #2c3e50;
        }

        .variable-value {
            font-family: 'Courier New', monospace;
            background-color: #f0f2f5;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        .variable-type {
            color: #666;
            font-size: 12px;
        }

        /* Settings Tab */
        #settings-tab {
            padding: 20px;
            overflow-y: auto;
        }

        .settings-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            padding: 30px;
            max-width: 600px;
        }

        .settings-container h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8dcE0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #2c2c2c;
            box-shadow: 0 0 0 3px rgba(44, 44, 44, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-save {
            flex: 1;
            padding: 12px;
            background-color: #2c2c2c;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-save:hover {
            background-color: #000000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .btn-reset {
            flex: 1;
            padding: 12px;
            background-color: #e8ecf1;
            color: #2c3e50;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-reset:hover {
            background-color: #d8e0ea;
        }

        .form-helper {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 15px;
                gap: 15px;
            }

            nav button {
                padding: 10px 12px;
                font-size: 13px;
            }

            .status-panel {
                gap: 12px;
                font-size: 11px;
            }

            .settings-container {
                padding: 20px;
            }

            .canvas-header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }

        .blocklyToolboxCategoryLabel {
            color: #2c3e50;
        }

        /* Blockly Dialog Styling */
        .blocklyDialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            border: none;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 0;
            background-color: white;
            max-width: 90%;
            width: 400px;
        }

        .blocklyDialog::backdrop {
            background-color: rgba(0, 0, 0, 0.3);
        }

        .blocklyDialogForm {
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
        }

        .blocklyDialogPrompt {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            display: block;
            margin-bottom: 8px;
        }

        .blocklyDialogInput {
            padding: 12px 14px;
            border: 1px solid #d8dce0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .blocklyDialogInput:focus {
            outline: none;
            border-color: #2c2c2c;
            box-shadow: 0 0 0 3px rgba(44, 44, 44, 0.1);
        }

        .blocklyDialogButtonRow {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .blocklyDialogConfirmButton,
        .blocklyDialogCancelButton {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .blocklyDialogConfirmButton {
            background-color: #2c2c2c;
            color: white;
        }

        .blocklyDialogConfirmButton:hover {
            background-color: #000000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .blocklyDialogCancelButton {
            background-color: #e8ecf1;
            color: #2c3e50;
        }

        .blocklyDialogCancelButton:hover {
            background-color: #d8e0ea;
        }
    </style>
    <!-- Load Blockly core -->
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <!-- Load the default blocks -->
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <!-- Load a generator -->
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <!-- Load a message file -->
    <script src="https://unpkg.com/blockly/msg/en.js"></script>

<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="logo">Hexabot Code</div>
                <nav>
                    <button class="tab-button active" data-tab="programming">Programming</button>
                    <button class="tab-button" data-tab="data">Data</button>
                    <button class="tab-button" data-tab="settings">Settings</button>
                </nav>
            </div>
            <div class="status-panel">
                <div class="status-item">
                    <div class="status-indicator disconnected"></div>
                    <span>Disconnected</span>
                </div>
                <div class="status-item">
                    <span>Last ping: <strong><span id="lastPing">N/A</span> ms</strong></span>
                </div>
                <div class="status-item">
                    <span>Last clockcycle: <strong><span id="lastClockcycle">N/A</span> ms</strong></span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Programming Tab -->
        <div id="programming-tab" class="tab-content active">
            <div class="canvas-container">
                <div class="canvas-header">
                    <h2>Hexabot Programming Interface</h2>
                    <div class="canvas-controls">
                        <button class="btn btn-secondary"
                            onclick="document.getElementById('jsonFileInput').click();">Load code</button>
                        <input type="file" id="jsonFileInput" accept=".json" style="display:none;"
                            onchange="loadCode(event)" />
                        <button class="btn btn-secondary" onclick="saveCode()">Save code</button>
                        <hr>
                        <button class="btn btn-primary" id="runButton" onclick="runCode();">Run code</button>
                        <button class="btn btn-red" onclick="stopCode();">Stop code</button>
                    </div>
                </div>
                <div class="blockly-canvas">
                    <div id="blocklyDiv" style="height: 100%; width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Data Tab -->
        <div id="data-tab" class="tab-content">
            <div class="data-container">
                <div class="data-header">
                    <h2>Hexabot Data</h2>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Variable Name</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="dbTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings-tab" class="tab-content">
            <div class="settings-container">
                <h2>Hexabot Settings</h2>
                <form id="settings-form">
                    <div class="form-group">
                        <label for="robot-address">Robot Address</label>
                        <input type="text" id="robot-address" name="robot-address" value="192.168.1.100">
                        <div class="form-helper">IP address or hostname of your robot</div>
                    </div>

                    <!-- WARNING: Speed currently disabled! -->
                    <div class="form-group" style="display: none;">
                        <label for="robot-speed">Motor Speed (1-10)</label>
                        <input type="number" id="robot-speed" name="robot-speed" min="1" max="10" value="5">
                        <div class="form-helper">Default motor speed for movement commands</div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-save" onclick="saveSettings()">Save Settings</button>
                        <button type="reset" class="btn-reset" onclick="removeUserdata()">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Get all tab buttons
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');

        // Add click event listener to each button
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.getAttribute('data-tab');

                // Remove active class from all buttons and content
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));

                // Add active class to clicked button and corresponding content
                button.classList.add('active');
                document.getElementById(tabName + '-tab').classList.add('active');
            });
        });

        const indicator = document.querySelector('.status-indicator');
        const statusText = document.querySelector('.status-item span');
        function setConnectionStatus(status) {

            // Remove all status classes
            indicator.classList.remove('connected', 'connecting', 'disconnected');

            // Set the new status class and text
            switch (status) {
                case 'connected':

        const lastPingDOM = document.getElementById('lastPing');
        function connectRobot(addr) {
            if (localStorage.getItem("robotWebsocketAddress") != addr) {
                localStorage.setItem("robotWebsocketAddress", addr);
            }

            setConnectionStatus('connecting');
            robotsocket = new WebSocket(addr);

            robotsocket.addEventListener("open", (event) => {
                console.log(robotsocket);
                setConnectionStatus('connected');
            });
            robotsocket.addEventListener("message", (event) => {
                // console.log("Received WebSocket message: " + event.data);

                messageTimer += performance.now() - lastMessage;
                lastMessage = performance.now();
                messageCounter += 1;
                if (messageCounter % 10 == 0) {
                    lastPingDOM.innerHTML = new String(messageTimer / 10).padStart(2, "0");
                    messageTimer = 0;
                }

                let data = parseMessage(event.data);
                db[data.keys] = data.variables;
            });
            robotsocket.addEventListener("close", (event) => {
                console.log("Disconnected from WebSocket server");
                setConnectionStatus('disconnected');
            });
            robotsocket.addEventListener("error", (event) => {
                console.error("WebSocket error: " + event.message);
                setConnectionStatus('connecting');
            });
        }

        function parseMessage(message) {
            // Split by '/' and filter out empty strings
            const tokens = message.split('/').filter(token => token.length > 0);

            let keys = [];
            let variables = [];

            for (const token of tokens) {
                // Check if token starts with a letter (name)
                if (/^[a-zA-Z]/.test(token)) {
                    keys.push(token);
                }
                // Check if token is a number (variable)
                else if (/^-?\d+(\.\d+)?$/.test(token)) {
                    variables.push(parseFloat(token));
                }
            }

            return { keys, variables };
        }

        function hueToRgb(hue) {
            hue = (hue % 256) / 256 * 6;
            const i = Math.floor(hue);
            const f = hue - i;
            const q = 255 * (1 - f);
            const t = 255 * f;

            switch (i % 6) {
                case 0: return { r: 255, g: Math.round(t), b: 0 };
                case 1: return { r: Math.round(q), g: 255, b: 0 };
                case 2: return { r: 0, g: 255, b: Math.round(t) };
                case 3: return { r: 0, g: Math.round(q), b: 255 };
                case 4: return { r: Math.round(t), g: 0, b: 255 };
                case 5: return { r: 255, g: 0, b: Math.round(q) };
            }
        }
